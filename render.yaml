databases:
  - name: biz-erp-db
    plan: free
    databaseName: django_sample
    user: django_sample

services:
  - type: web
    name: biz-erp-sample
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: cd sample && python manage.py migrate --no-input && gunicorn sample.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: biz-erp-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
