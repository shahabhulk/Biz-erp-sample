{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Bizdom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'workshop/css/workshop.css' %}" rel="stylesheet">
    <style>
        :root { --topbar-bg: #714b67; }
        .login-topbar {
            background: var(--topbar-bg);
            color: #fff;
            height: 46px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }
        .login-topbar .brand { font-weight: 600; font-size: 1.1rem; }
        body { background: #f0f0f0; margin: 0; }
    </style>
</head>
<body>
    <header class="login-topbar">
        <span class="brand">Bizdom</span>
    </header>

    <div class="d-flex align-items-center justify-content-center px-3" style="min-height: calc(100vh - 46px);">
        <div class="card shadow-sm border-0 w-100" style="max-width: 380px;">
            <div class="card-body p-4">
                <h1 class="h5 mb-1">Sign in</h1>
                <p class="text-muted small mb-4">BIZDOM ERP </p>

                {% if form.errors %}
                <div class="alert alert-danger py-2 small mb-3">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label small text-muted">Username</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" autofocus required
                               autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label small text-muted">Password</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" required
                               autocomplete="current-password">
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button type="submit" class="odoo-btn-primary w-100 border-0">
                        <i class="bi bi-box-arrow-in-right"></i> Log in
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
